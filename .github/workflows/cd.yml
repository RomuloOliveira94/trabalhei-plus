# CD — gate on CI, build the image here, let CapRover pull the finished image.
#
#   push to main → wait_for_ci      polls ci.yml for this exact SHA and only
#                                   proceeds if it went green
#                → build_and_deploy `docker build` on the Actions runner, push
#                                   to ghcr.io/<owner>/<repo>:<sha7> (+ :latest),
#                                   then hand CapRover the image name — the
#                                   server only has to `docker pull` it.
#
# CapRover no longer builds anything. The previous flow uploaded a tarball of the
# repo and ran `docker build` server-side from the Dockerfile that
# `captain-definition` points at; that file stays in the repo root for manual
# tarball deploys (`caprover deploy`), but CD does not use it any more.
#
# Prerequisite on the CapRover side: the ghcr.io package is private by default,
# so ghcr.io must be registered under Cluster → Docker Registries with a PAT that
# has `read:packages`, otherwise the pull fails with "unauthorized".
name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only one deploy at a time; a second push queues behind the first instead of
# racing it (CapRover applies deploys sequentially anyway, but this keeps the
# Actions side honest too).
# GitHub keeps at most one *pending* run per group, so on rapid successive
# pushes the middle run is cancelled (shows red) and the newest SHA deploys.
concurrency:
  group: caprover-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # `main` is not branch-protected here — work lands straight on it, with no PR
  # gate in front. What does run on every push to `main` is ci.yml, via its own
  # `push: branches: [main]` trigger: the `test`, `system-test`, `lint`,
  # `scan_ruby` and `scan_js` jobs, on the exact commit we're about to deploy.
  # Rather than re-running (and duplicating) that whole 5-job matrix here, this
  # job waits for that sibling run to finish and only proceeds if it succeeded —
  # a cheap, read-only confirmation instead of a second, redundant test pass,
  # and the only thing standing between a red commit and production.
  wait_for_ci:
    name: Wait for CI to pass on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll the CI workflow run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for the CI workflow (ci.yml) to complete on ${sha}"

          for attempt in $(seq 1 60); do
            # `|| true` keeps a transient gh/API failure (5xx, rate limit) from
            # aborting the whole gate under `set -e`: run_json comes back empty
            # and this poll falls into the "no run found yet" branch below.
            run_json=$(gh run list --repo "$repo" --workflow=ci.yml --commit="$sha" \
              --json status,conclusion --jq '.[0] // empty') || true

            if [ -z "$run_json" ]; then
              echo "[$attempt/60] No CI run found yet for ${sha}, waiting..."
              sleep 15
              continue
            fi

            status=$(jq -r '.status' <<<"$run_json")
            if [ "$status" != "completed" ]; then
              echo "[$attempt/60] CI run status: ${status}, waiting..."
              sleep 15
              continue
            fi

            conclusion=$(jq -r '.conclusion' <<<"$run_json")
            if [ "$conclusion" = "success" ]; then
              echo "CI passed for ${sha}."
              exit 0
            fi

            echo "CI concluded '${conclusion}' for ${sha} — refusing to deploy."
            exit 1
          done

          echo "Timed out waiting for CI to complete on ${sha}."
          exit 1

  build_and_deploy:
    name: Build the image and deploy it to CapRover
    needs: wait_for_ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `packages: write` is what lets the built-in GITHUB_TOKEN push to ghcr.io,
    # so no PAT has to live in the repo. If an org policy ever stops GITHUB_TOKEN
    # from writing packages, put a classic PAT with `write:packages` in
    # `secrets.ACCESS_TOKEN` and use it as the login password instead.
    # Job-level permissions replace the workflow-level block: this job does not
    # need the `actions: read` the CI poll uses.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io only accepts lowercase image paths and this owner is mixed-case
      # (RomuloOliveira94), hence the `tr`. The 7-char SHA tag is the immutable
      # one CapRover deploys and the one to roll back to; `:latest` is a
      # convenience pointer for manual pulls.
      - name: Preset image name
        run: |
          set -euo pipefail
          image=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "IMAGE_URL=${image}:$(echo "${{ github.sha }}" | cut -c1-7)"
            echo "IMAGE_LATEST=${image}:latest"
          } >> "$GITHUB_ENV"

      # No Node/npm step — this app has no package.json (Importmap +
      # tailwindcss-rails), the Dockerfile does everything. The layer cache lives
      # in the Actions cache, so an unchanged Gemfile.lock skips `bundle install`
      # on the next run.
      - name: Build and push the image to ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URL }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `image:` (added in v1.1.0) makes CapRover pull that tag instead of
      # accepting an uploaded tarball. v1.1.2 is the first release whose
      # `runs.image` is its own `Dockerfile` rather than the floating
      # `docker://ghcr.io/caprover/deploy-from-github:main` container — up to
      # v1.1.1, pinning the tag pinned nothing, since the action still pulled
      # whatever `:main` happened to be. Pinned to the exact tag: this action
      # publishes no moving `v1` pointer.
      - name: Deploy the image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ secrets.CAPROVER_SERVER }}'
          app: '${{ secrets.CAPROVER_APP_NAME }}'
          token: '${{ secrets.CAPROVER_APP_TOKEN }}'
          image: '${{ env.IMAGE_URL }}'
