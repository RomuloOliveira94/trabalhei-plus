# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. The default locale for this app is
# pt-BR (see config/application.rb); this file remains as the English fallback.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
en:
  hello: "Hello world"
  activerecord:
    attributes:
      user:
        name: "Name"
  layouts:
    application:
      app_name: "Trabalhei a Mais"
      sign_in: "Sign in"
      sign_out: "Sign out"
  home:
    show:
      welcome: "Welcome, %{name}!"
      placeholder_notice: "The overtime dashboard is coming soon — hour tracking lands in the next phase."
